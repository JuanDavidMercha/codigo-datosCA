name: Captura aire cada hora

on:
  schedule:
    - cron: '0 * * * *'   # cada hora (UTC)
  workflow_dispatch:

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: captura-aire-cada-hora
      cancel-in-progress: false

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -U pip
          pip install pandas requests pytz pydrive2

      - name: Ejecutar script (genera CSV en ./salida)
        run: |
          mkdir -p salida
          python captura_datos.py

      # ✅ Verificación segura (funciona con secretos multilínea)
      - name: Verificar existencia de secrets (seguro)
        env:
          HAS_DRIVE_SA_JSON: ${{ secrets.DRIVE_SA_JSON != '' }}
          HAS_ID_CARPETA: ${{ secrets.ID_CARPETA_DRIVE != '' }}
        run: |
          if [ "$HAS_DRIVE_SA_JSON" != "true" ]; then
            echo "FALTA DRIVE_SA_JSON"; exit 1
          fi
          if [ "$HAS_ID_CARPETA" != "true" ]; then
            echo "FALTA ID_CARPETA_DRIVE"; exit 1
          fi
          echo "Secrets OK"

      - name: Subir CSV a Google Drive
        env:
          DRIVE_SA_JSON: ${{ secrets.DRIVE_SA_JSON }}
          ID_CARPETA_DRIVE: ${{ secrets.ID_CARPETA_DRIVE }}
        run: python subir_a_drive.py
