name: Captura aire cada hora

on:
  schedule:
    - cron: '0 * * * *'   # cada hora (UTC)
  workflow_dispatch:

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: captura-aire-cada-hora
      cancel-in-progress: false

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -V
          pip install -U pip
          pip install pandas requests pytz pydrive2

      - name: Ejecutar script (genera CSV en ./salida)
        run: |
          mkdir -p salida
          python captura_datos.py

      - name: Verificar existencia de secrets (sin mostrar contenido)
        run: |
          test -n "${{ secrets.DRIVE_SA_JSON }}" || (echo "FALTA DRIVE_SA_JSON" && exit 1)
          test -n "${{ secrets.ID_CARPETA_DRIVE }}" || (echo "FALTA ID_CARPETA_DRIVE" && exit 1)
          echo "Secrets OK"

      - name: Subir CSV a Google Drive
        env:
          DRIVE_SA_JSON: ${{ secrets.DRIVE_SA_JSON }}
          ID_CARPETA_DRIVE: ${{ secrets.ID_CARPETA_DRIVE }}
        run: python subir_a_drive.py
